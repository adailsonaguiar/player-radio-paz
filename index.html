<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rádio Paz FM - Player</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/player.css" />
  </head>
  <body>
    <div class="radio-miniplayer">
      <audio id="radioStream" preload="none">
        <source
          src="https://player.radiopazpalmas.com.br/stream"
          type="audio/mpeg"
        />
      </audio>

      <div class="player-content">
        <div class="player-info">
          <div class="live-indicator">
            <span class="pulse"></span>
            <span class="live-text">AO VIVO</span>
          </div>
          <div class="station-name">Rádio Paz FM</div>
        </div>

        <div class="player-controls">
          <button id="playBtn" class="play-btn" aria-label="Play/Pause">
            <i class="fas fa-play play-icon"></i>
            <i class="fas fa-pause pause-icon"></i>
          </button>

          <div class="volume-control">
            <button id="volumeBtn" class="volume-btn" aria-label="Volume">
              <i class="fas fa-volume-up volume-on"></i>
              <i class="fas fa-volume-mute volume-off"></i>
            </button>
            <input
              type="range"
              id="volumeSlider"
              class="volume-slider"
              min="0"
              max="100"
              value="80"
            />
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const audio = document.getElementById("radioStream");
        const playBtn = document.getElementById("playBtn");
        const volumeBtn = document.getElementById("volumeBtn");
        const volumeSlider = document.getElementById("volumeSlider");
        const player = document.querySelector(".radio-miniplayer");

        let isPlaying = false;
        audio.volume = 0.8;

        function togglePlay() {
          if (isPlaying) {
            audio.pause();
            player.classList.remove("playing");
            isPlaying = false;
          } else {
            audio.play();
            player.classList.add("playing");
            isPlaying = true;
          }
        }

        function toggleMute() {
          audio.muted = !audio.muted;
          player.classList.toggle("muted", audio.muted);
        }

        function changeVolume() {
          audio.volume = volumeSlider.value / 100;
          if (audio.volume === 0) {
            audio.muted = true;
            player.classList.add("muted");
          } else {
            audio.muted = false;
            player.classList.remove("muted");
          }
        }

        playBtn.addEventListener("click", togglePlay);
        volumeBtn.addEventListener("click", toggleMute);
        volumeSlider.addEventListener("input", changeVolume);

        // Autoplay ao carregar a página
        window.addEventListener("load", () => {
          audio.play().then(() => {
            player.classList.add("playing");
            isPlaying = true;
          }).catch(() => {
            // Navegadores bloqueiam autoplay sem interação do usuário
            // Tenta tocar ao primeiro clique na página
            document.addEventListener("click", function autoplayOnClick() {
              if (!isPlaying) {
                audio.play();
                player.classList.add("playing");
                isPlaying = true;
              }
              document.removeEventListener("click", autoplayOnClick);
            }, { once: true });
          });
        });

        // Atualiza estado visual quando áudio para/inicia
        audio.addEventListener("playing", () => {
          player.classList.add("playing");
          isPlaying = true;
        });

        audio.addEventListener("pause", () => {
          player.classList.remove("playing");
          isPlaying = false;
        });
      })();
    </script>
  </body>
</html>
